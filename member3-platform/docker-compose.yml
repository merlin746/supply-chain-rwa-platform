services:
  mysql:
    image: mysql:8.4
    container_name: rwa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rwa_supply_chain
    ports:
      - "3306:3306"
    volumes:
      - ./database/rwa_supply_chain.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: rwa-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rwa_supply_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      WEB3_RPC_URL: http://host.docker.internal:8545
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: rwa-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
