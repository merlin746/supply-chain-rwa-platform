spring:
  datasource:
    url: jdbc:h2:mem:rwa_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/demo-schema.sql
      data-locations: classpath:db/demo-data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Demo profile 完全链下运行，不需要 Hardhat、私钥或 RPC 节点。
web3:
  enabled: false
  contract-address: "0x0000000000000000000000000000000000000000"
  keys: {}
